<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Page</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        color: #333;
      }

      .welcome {
        text-align: center;
        padding: 100px 20px;
        background-color: white;
        margin: 80px auto;
        max-width: 600px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #2563eb;
        font-size: 36px;
      }

      p {
        font-size: 18px;
        color: #666;
      }

      button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>

  <body>
    <div class="welcome">
      <h1>Welcome to My Website!</h1>
      <p>I'm glad you're here. Let's build something amazing!</p>
      <button onclick="alert('Welcome! Thanks for visiting.')">
        Get Started
      </button>
    </div>
  </body>
</html>
